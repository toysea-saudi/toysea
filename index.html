<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOYSEA – Digital Business Card</title>
<style>
:root{
  --bg:#F8FAFE; color-scheme:light; --card:#ffffff; --ink:#0F1B3D; --muted:#5B6685; --line:#E3E7F2; --panel:#F6F8FD;
  --blue:#4BB0E8; --red:#D12B4F; --green:#78CC4A; --yellow:#F6DD2B; --pink:#E8167F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(circle at 15% 10%,rgba(75,176,232,.10),transparent 40%),radial-gradient(circle at 90% 90%,rgba(232,22,127,.07),transparent 40%)}
.card{width:100%;max-width:880px;background:var(--card);border-radius:28px;overflow:hidden;
  box-shadow:0 30px 70px -25px rgba(15,27,61,.35);display:grid;grid-template-columns:1.1fr .9fr}
.stripe{grid-column:1/-1;height:8px;background:linear-gradient(90deg,var(--blue) 0 20%,var(--red) 20% 40%,var(--green) 40% 60%,var(--yellow) 60% 80%,var(--pink) 80%)}
.left{padding:34px 34px 30px}
.logo{display:block;width:min(260px,70%);height:auto;margin:0 0 6px -4px}
.tag{margin:0 0 26px;color:var(--muted);font-size:.95rem;letter-spacing:.02em}
.rows{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;
  text-decoration:none;color:inherit;background:var(--panel);transition:transform .15s,border-color .15s}
.row:hover{transform:translateY(-2px);border-color:var(--blue)}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.row b{font-weight:600;font-size:.98rem;word-break:break-all}
.socials{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.soc{flex:1 1 90px;text-align:center;padding:11px 10px;border-radius:14px;color:#fff;text-decoration:none;font-weight:600;font-size:.86rem}
.right{background:linear-gradient(160deg,#0F1B3D,#1B2C68);color:#fff;padding:34px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.qr{background:#fff;padding:14px;border-radius:20px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.qr svg,.qr img{display:block;width:200px;height:200px}
.right h2{margin:0;font-size:1.15rem}
.right p{margin:0;color:#B9C3E6;font-size:.85rem;max-width:240px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;color:#0F1B3D;background:var(--yellow);padding:14px 26px;border-radius:999px;
  display:inline-flex;gap:10px;align-items:center;box-shadow:0 10px 24px -10px rgba(246,221,43,.8);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.err{color:#ffb4b4;font-size:.8rem}
@media (max-width:720px){
  .card{grid-template-columns:1fr;border-radius:24px}
  .left{padding:26px 20px 22px}
  .right{padding:28px 20px 32px}
}
</style>
</head>
